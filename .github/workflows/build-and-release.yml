name: Build and Release  (CLI + GUI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: 'false'

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write


jobs:
  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential \
            libbz2-dev libcurl4-gnutls-dev nlohmann-json3-dev

      - name: Build CLI
        run: |
          mkdir build-cli-linux && cd build-cli-linux
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-cli-linux
          path: build-cli-linux/FastDLTool
          retention-days: 7


  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
          .\vcpkg install bzip2:x64-windows nlohmann-json:x64-windows --classic --recurse

      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-cli-windows | Out-Null
          cd build-cli-windows
          cmake .. -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -A x64
          cmake --build . --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-cli-windows
          path: build-cli-windows/Release/FastDLTool.exe
          retention-days: 7

  build-gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ build-essential \
            libbz2-dev libcurl4-gnutls-dev \
            python3 python3-pip python3-venv \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3
          # ↑ xcb / xkb libs are required by PyQt6 at runtime even in
          #   headless mode; PyInstaller bundles them into the binary.

      - name: Download nlohmann/json
        run: |
          mkdir -p third_party/nlohmann
          curl -fsSL \
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp \
            -o third_party/nlohmann/json.hpp

      - name: Stage GUI sources
        run: |
          mkdir -p gui/src gui/third_party
          # Core sources live in src/
          cp src/FastDLDownloader.cpp src/FastDLDownloader.h \
             src/ConfigManager.cpp    src/ConfigManager.h \
             src/Utils.h src/ProgressBar.h \
             gui/src/
          # C API bridge lives in the repo root (next to CMakeLists.txt)
          # Use $GITHUB_WORKSPACE explicitly to avoid working-directory drift.
          echo "  Workspace contents (root):" && ls "$GITHUB_WORKSPACE"
          for f in fastdl_capi.cpp fastdl_capi.h; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              cp "$GITHUB_WORKSPACE/$f" gui/src/
            elif [ -f "$GITHUB_WORKSPACE/src/$f" ]; then
              cp "$GITHUB_WORKSPACE/src/$f" gui/src/
            else
              echo "ERROR: cannot find $f in $GITHUB_WORKSPACE or $GITHUB_WORKSPACE/src/" && exit 1
            fi
          done
          cp -r third_party/nlohmann gui/third_party/

      - name: Build shared library
        run: |
          mkdir -p gui/build && cd gui/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="${{ github.workspace }}/gui"
          cmake --build . --parallel $(nproc)
          # Fallback: find and copy if CMake didn't honour the output dir
          if [ ! -f "${{ github.workspace }}/gui/libfastdl.so" ]; then
            find gui/build -name "libfastdl.so" | head -1 \
              | xargs -I{} cp {} gui/libfastdl.so
          fi
          echo "Library: $(ls -lh gui/libfastdl.so)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build GUI executable (PyInstaller)
        run: |
          pyinstaller fastdl_gui.spec \
            --distpath dist \
            --workpath build-pyinstaller \
            --noconfirm \
            --clean
          echo "--- dist contents ---"
          ls -lh dist/
          # Verify the binary was produced
          test -f dist/FastDLTool || \
            { echo "ERROR: dist/FastDLTool not found"; exit 1; }

      - name: Smoke-test executable
        run: |
          # QT_QPA_PLATFORM=offscreen lets the Qt platform plugin initialise
          # without a real display; the app will error out quickly but we just
          # want to confirm it isn't a missing-library crash.
          QT_QPA_PLATFORM=offscreen timeout 5 dist/FastDLTool || true

      - name: Rename artifact
        run: cp dist/FastDLTool FastDLTool-GUI-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-gui-linux
          path: FastDLTool-GUI-linux-x86_64
          retention-days: 7

  build-gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download nlohmann/json
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party\nlohmann | Out-Null
          Invoke-WebRequest `
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp `
            -OutFile third_party\nlohmann\json.hpp

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
          .\vcpkg install bzip2:x64-windows --classic --recurse

      - name: Stage GUI sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gui\src, gui\third_party | Out-Null
          # Core sources live in src\
          foreach ($f in @(
              "FastDLDownloader.cpp","FastDLDownloader.h",
              "ConfigManager.cpp","ConfigManager.h",
              "Utils.h","ProgressBar.h"
          )) {
            Copy-Item "src\$f" "gui\src\$f"
          }
          # C API bridge lives in the repo root (next to CMakeLists.txt)
          # Use $env:GITHUB_WORKSPACE explicitly to avoid working-directory drift.
          Write-Host "  Workspace contents (root):" ; Get-ChildItem $env:GITHUB_WORKSPACE
          foreach ($f in @("fastdl_capi.cpp","fastdl_capi.h")) {
            if (Test-Path "$env:GITHUB_WORKSPACE\$f") {
              Copy-Item "$env:GITHUB_WORKSPACE\$f" "gui\src\$f"
            } elseif (Test-Path "$env:GITHUB_WORKSPACE\src\$f") {
              Copy-Item "$env:GITHUB_WORKSPACE\src\$f" "gui\src\$f"
            } else {
              Write-Host "ERROR: cannot find $f in $env:GITHUB_WORKSPACE or $env:GITHUB_WORKSPACE\src\"
              exit 1
            }
          }
          Copy-Item -Recurse -Force third_party\nlohmann gui\third_party\nlohmann

      - name: Build shared library (DLL)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gui\build-win | Out-Null
          Push-Location gui\build-win
          cmake ..\  `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_SHARED_LIBS=ON `
            -A x64
          cmake --build . --config Release
          Pop-Location

          # Locate and copy DLL to gui\ (where the spec expects it)
          $dll = Get-ChildItem -Path gui\build-win -Filter "fastdl.dll" -Recurse |
                   Select-Object -First 1
          if (-not $dll) {
            Write-Host "ERROR: fastdl.dll not found after build"
            exit 1
          }
          Copy-Item $dll.FullName gui\fastdl.dll
          Write-Host "DLL: $(Get-Item gui\fastdl.dll | Select-Object -ExpandProperty FullName)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller
        shell: pwsh

      - name: Build GUI executable (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller fastdl_gui.spec `
            --distpath dist `
            --workpath build-pyinstaller `
            --noconfirm `
            --clean
          Write-Host "--- dist contents ---"
          Get-ChildItem dist\
          if (-not (Test-Path "dist\FastDLTool.exe")) {
            Write-Host "ERROR: dist\FastDLTool.exe not found"
            exit 1
          }

      - name: Rename artifact
        shell: pwsh
        run: Copy-Item dist\FastDLTool.exe FastDLTool-GUI-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-gui-windows
          path: FastDLTool-GUI-windows-x86_64.exe
          retention-days: 7

  release:
    needs:
      - build-cli-linux
      - build-cli-windows
      - build-gui-linux
      - build-gui-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          # CLI binaries
          cp dist/fastdl-cli-linux/FastDLTool       FastDLTool-linux-x86_64
          cp dist/fastdl-cli-windows/FastDLTool.exe  FastDLTool-windows-x86_64.exe
          chmod +x FastDLTool-linux-x86_64

          # GUI standalone executables (already renamed by each build job)
          cp dist/fastdl-gui-linux/FastDLTool-GUI-linux-x86_64     FastDLTool-GUI-linux-x86_64
          cp dist/fastdl-gui-windows/FastDLTool-GUI-windows-x86_64.exe FastDLTool-GUI-windows-x86_64.exe
          chmod +x FastDLTool-GUI-linux-x86_64

          echo "Release assets:"
          ls -lah FastDLTool*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## FastDL Tool v${{ env.VERSION }}

            ### Downloads

            | File | Platform | Type | Notes |
            |------|----------|------|-------|
            | `FastDLTool-linux-x86_64` | Linux | CLI | Statically linked, no deps |
            | `FastDLTool-windows-x86_64.exe` | Windows | CLI | Statically linked, no deps |
            | `FastDLTool-GUI-linux-x86_64` | Linux | GUI | Single binary, no Python needed |
            | `FastDLTool-GUI-windows-x86_64.exe` | Windows | GUI | Single .exe, no Python needed |

            ### GUI Quick Start
            The GUI executables are fully self-contained — no Python installation,
            no DLLs, no `.so` files required. Just download and run:

            **Linux**
            ```bash
            chmod +x FastDLTool-GUI-linux-x86_64
            ./FastDLTool-GUI-linux-x86_64
            ```

            **Windows**
            ```
            Double-click FastDLTool-GUI-windows-x86_64.exe
            ```

            ### CLI Quick Start
            ```bash
            # Linux
            chmod +x FastDLTool-linux-x86_64
            ./FastDLTool-linux-x86_64 --help

            # Windows
            FastDLTool-windows-x86_64.exe --help
            ```
          files: |
            FastDLTool-linux-x86_64
            FastDLTool-windows-x86_64.exe
            FastDLTool-GUI-linux-x86_64
            FastDLTool-GUI-windows-x86_64.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}